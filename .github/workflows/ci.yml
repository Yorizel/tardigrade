name: ci

# The required gate runs on every PR and every push to main. Docs-only PRs check prose and build
# the web app; other PRs and pushes run the same full gate used locally.
# Releases are `.github/workflows/publish.yml` via release-please on main; this workflow does not
# publish.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# checkout is the only thing that touches the repo; nothing writes back.
permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Detect docs-only PR
        id: changes
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          changed_files="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          if [[ -n "$changed_files" ]] && ! grep -Eqv '^docs/' <<< "$changed_files"; then
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary
      # --frozen-lockfile: a PR that changes deps without committing bun.lock fails here instead of
      # silently resolving something different from what everyone else installed.
      - run: bun install --frozen-lockfile
      - uses: pnpm/action-setup@v6
        if: steps.changes.outputs.docs_only != 'true'
        with:
          version: 12.7.0
      - uses: dtolnay/rust-toolchain@stable
        if: steps.changes.outputs.docs_only != 'true'
        with:
          toolchain: "1.99.1"
          components: rustfmt
      - uses: actions/cache@v5
        if: steps.changes.outputs.docs_only != 'true'
        with:
          path: |
            .cache/native-oxlint/artifacts
            .cache/native-svg-source/oxc/target
          key: native-oxlint-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/native-oxlint-policy.ts', 'tools/native-oxlint-build.ts', 'tools/patches/oxlint-svg-namespace.patch', 'tools/patches/oxlint-node-postmessage.patch', 'bun.lock') }}
      - run: bun run tools/native-oxlint-build.ts
        if: steps.changes.outputs.docs_only != 'true'
      - run: bun run gate --only=lint:docs,build:app-web
        if: steps.changes.outputs.docs_only == 'true'
      - run: bun run gate
        if: steps.changes.outputs.docs_only != 'true'
